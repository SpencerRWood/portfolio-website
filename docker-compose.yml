services:
  backend:
    build:
      context: ./backend
    environment:
      UV_FROZEN: "1"
      WEBSITE_ENV: ${WEBSITE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-}
      WOOD_DATA_PLATFORM_DATABASE_URL: ${WOOD_DATA_PLATFORM_DATABASE_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ""
      BACKEND_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
