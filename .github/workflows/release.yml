{
  "name": "Release",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": null
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "release": {
      "if": "github.ref == 'refs/heads/main'",
      "uses": "SpencerRWood/workflows/.github/workflows/release-container.yml@9748b1cd6287d84d55c4277c93ca5dae01fb1787",
      "permissions": {
        "contents": "write",
        "packages": "write",
        "id-token": "write",
        "attestations": "write"
      },
      "with": {
        "workflow_revision": "9748b1cd6287d84d55c4277c93ca5dae01fb1787"
      }
    },
    "promotion": {
      "needs": "release",
      "if": "${{ github.ref == 'refs/heads/main' && needs.release.outputs.released == 'true' }}",
      "uses": "SpencerRWood/workflows/.github/workflows/promote-container-to-dev.yml@9748b1cd6287d84d55c4277c93ca5dae01fb1787",
      "permissions": {
        "contents": "read"
      },
      "with": {
        "infrastructure_repository": "SpencerRWood/infrastructure",
        "image_key": "portfolio_website_image_ref",
        "image_name": "portfolio-website",
        "release_tag": "${{ needs.release.outputs.release_tag }}",
        "image_repository": "${{ needs.release.outputs.image_repository }}",
        "version_image": "${{ needs.release.outputs.version_image }}",
        "image_digest": "${{ needs.release.outputs.image_digest }}",
        "version_image_digest": "${{ needs.release.outputs.version_image_digest }}",
        "workflow_revision": "9748b1cd6287d84d55c4277c93ca5dae01fb1787"
      },
      "secrets": {
        "infrastructure_token": "${{ secrets.INFRASTRUCTURE_PR_TOKEN }}"
      }
    }
  }
}
